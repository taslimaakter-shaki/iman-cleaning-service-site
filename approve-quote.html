    <style>
      :root {
        --green: #075f5d;
        --green-dark: #034341;
        --green-ink: #062f31;
        --leaf: #8fc94c;
        --gold: #e8a72e;
        --blue: #2b93a2;
        --ink: #1f2933;
        --muted: #62717f;
        --paper: #ffffff;
        --soft: #f3f7f4;
        --line: #d8e4e2;
        --danger: #a93131;
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 8% 5%, rgba(143, 201, 76, .13), transparent 24rem),
          radial-gradient(circle at 94% 24%, rgba(43, 147, 162, .11), transparent 27rem),
          linear-gradient(180deg, #f8fbf8 0%, #f2f7f5 55%, #eef5f2 100%);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        width: min(1160px, calc(100% - 32px));
        margin: 0 auto;
      }

      .quote-page-header {
        position: relative;
        background: linear-gradient(115deg, #032f31 0%, #075f5d 68%, #087b76 100%);
        color: #ffffff;
        padding: 16px 0;
        box-shadow: 0 10px 32px rgba(3, 67, 65, .18);
      }

      .quote-page-header::after {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--leaf), #d9df4c 45%, var(--gold));
        content: "";
      }

      body .site-reviews {
        --reviews-muted: #5c6c69;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: .82rem;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .brand img {
        width: 102px;
        height: 43px;
        border-radius: 12px;
        background: #ffffff;
        object-fit: contain;
        padding: 5px 8px;
      }

      main {
        padding: clamp(28px, 4.5vw, 54px) 0 clamp(44px, 6vw, 76px);
      }

      .panel {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: rgba(255, 255, 255, .96);
        padding: clamp(24px, 4vw, 46px);
        box-shadow: 0 26px 70px rgba(13, 66, 62, .11), 0 2px 8px rgba(13, 66, 62, .04);
      }

      .panel::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 5px;
        background: linear-gradient(90deg, var(--green), var(--blue) 54%, var(--leaf));
        content: "";
      }

      .estimate-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 2px 0 10px;
        color: #4f7e37;
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .estimate-kicker::before {
        width: 24px;
        height: 2px;
        border-radius: 999px;
        background: var(--leaf);
        content: "";
      }

      h1 {
        margin: 0 0 9px;
        max-width: 720px;
        color: var(--green-ink);
        font-size: clamp(1.72rem, 3vw, 2.35rem);
        font-weight: 800;
        letter-spacing: -.035em;
        line-height: 1.12;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .quote-summary {
        margin: 26px 0 0;
      }

      .instant-checkout-shell { padding: clamp(24px, 4vw, 42px); border: 1px solid var(--border-subtle); border-radius: 24px; background: #fff; box-shadow: var(--shadow-md); }
      .instant-checkout-shell .booking-step-head { margin-bottom: 0; }
      .instant-checkout-shell .booking-step-head h2 { margin-bottom: 0; }
      .booking-review-address p { margin: 0; color: var(--text-body); font-size: .88rem; line-height: 1.55; }
      .booking-review-address p + p { margin-top: 5px; }

      .estimate-sections { display: grid; gap: 16px; min-width: 0; }
      .estimate-card { position: relative; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 22px 22px 25px; background: #fff; min-width: 0; overflow: hidden; overflow-wrap: anywhere; box-shadow: 0 7px 22px rgba(12, 67, 64, .045); }
      .estimate-sections > .estimate-card::before { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--green); content: ""; }
      .estimate-sections > .estimate-card:nth-child(2)::before { background: var(--gold); }
      .estimate-sections > .estimate-card:nth-child(3)::before { background: var(--blue); }
      .estimate-sections > .estimate-card:nth-child(4)::before { background: #c99c3b; }
      .estimate-card h2 { margin: 0 0 14px; font-size: 1.02rem; letter-spacing: -.01em; color: var(--green-dark); }
      .quote-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; padding: 0; }
      .quote-fact { padding: 21px 24px; }
      .quote-fact + .quote-fact { border-left: 1px solid var(--line); }
      .quote-fact .estimate-label { color: #71807f; }
      .quote-fact strong { display: block; margin-top: 7px; color: var(--green-dark); font-size: 1.25rem; letter-spacing: -.025em; }
      .quote-fact small { display: block; margin-top: 4px; color: var(--muted); font-size: .82rem; line-height: 1.45; }
      .estimate-card .summary-row + .summary-row { margin-top: 12px; }
      .package-list { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; padding: 0; margin: 0; color: #425d63; line-height: 1.5; }
      .package-list li { display: flex; gap: 8px; align-items: baseline; }
      .package-list li::before { content: "✓"; color: #609235; font-weight: 700; }
      .package-unit + .package-unit { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
      .package-unit h3 { margin: 0 0 12px; color: var(--green-dark); font-size: 1rem; }
      .unit-pricing + .unit-pricing { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 20px; }
      .unit-pricing h3 { color: var(--green-dark); font-size: 1rem; margin: 0; }
      .price-line small { display: block; font-size: .8125rem; color: var(--muted); margin-top: 4px; }
      .service-notes { white-space: pre-wrap; }
      .service-description-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 11px 15px; border: 1px solid #8fb7b0; border-radius: 12px; background: #eff8f6; color: var(--green-dark); font-weight: 750; text-decoration: none; }
      .service-description-link:hover { border-color: var(--green-dark); background: #e3f2ef; }
      .estimate-label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
      .estimate-price { display: block; color: var(--green-dark); font-size: clamp(2.35rem, 4.2vw, 3.15rem); font-weight: 800; letter-spacing: -.055em; line-height: 1; margin: 10px 0 8px; }
      .estimate-divider { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
      .estimate-card p + p { margin-top: 8px; }
      .estimate-payment { position: sticky; top: 22px; border-color: #bad5cf; padding-top: 28px; background: linear-gradient(180deg, #f2faf7 0, #fff 115px); box-shadow: 0 18px 45px rgba(7, 95, 93, .13); }
      .estimate-payment::before { position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, var(--leaf), #d6d94a, var(--gold)); content: ""; }
      .estimate-payment strong { color: var(--green-dark); }
      .estimate-payment button { display: block; width: 100%; margin-top: 20px; padding: 14px 18px; font-weight: 800; box-shadow: 0 9px 20px rgba(7, 95, 93, .2); transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
      .estimate-payment button:not(:disabled):hover { transform: translateY(-2px); background: #064f4d; box-shadow: 0 13px 25px rgba(7, 95, 93, .25); }
      .checkout-trust { display: grid; gap: 9px; margin-top: 16px; color: #496361; font-size: .8rem; font-weight: 650; line-height: 1.45; }
      .checkout-trust span::before { margin-right: 5px; color: #609235; content: "✓"; font-weight: 900; }
      .checkout-trust strong { color: var(--green-dark); }
      .estimate-card summary { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: .96rem; font-weight: 750; color: var(--green-dark); list-style: none; }
      .estimate-card summary::-webkit-details-marker { display: none; }
      .estimate-card summary::before { display: grid; width: 24px; height: 24px; border-radius: 50%; background: #fff4db; color: #9b6512; content: "+"; place-items: center; font-size: 1rem; }
      .estimate-card[open] summary::before { content: "−"; }
      .price-lines { margin-top: 20px; }
      .price-line { display: flex; justify-content: space-between; gap: 20px; margin: 12px 0; color: #425d63; line-height: 1.5; }
      .price-line strong { white-space: nowrap; color: var(--green-dark); }
      .estimate-note { background: linear-gradient(135deg, #fffaf0, #fffdf8); border-color: #ead8b6; }
      body.quote-agreement-open { overflow: hidden; }
      .agreement-dialog { width: min(760px, calc(100% - 32px)); max-height: calc(100vh - 32px); max-height: min(90dvh, 950px); padding: 0; margin: auto; border: 1px solid var(--line); border-radius: 22px; background: #fff; color: var(--ink); box-shadow: 0 28px 80px #00212747; overflow: hidden; }
      .agreement-dialog[open] { display: flex; flex-direction: column; }
      .agreement-dialog::backdrop { background: #03282db8; backdrop-filter: blur(5px); }
      .agreement-dialog-head { display: flex; flex: none; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px; border-bottom: 1px solid var(--line); }
      .agreement-dialog-head h2 { margin: 0; color: var(--green-dark); font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.2; }
      .agreement-dialog-head button { flex: 0 0 44px; width: 44px; min-height: 44px; padding: 0; border: 1px solid var(--line); background: var(--soft); color: var(--green-dark); font-size: 1.45rem; }
      #approvalForm { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px; }
      .agreement-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      .agreement-back { background: #fff; color: var(--green-dark); border: 1px solid var(--line); }
      [hidden] { display: none !important; }
      a:focus-visible, button:focus-visible { outline: 3px solid #84b35e; outline-offset: 3px; }

      .summary-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 12px;
      }

      .summary-row strong {
        color: var(--green-dark);
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 800;
      }

      input[type="file"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        font: inherit;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 13px;
        color: var(--ink);
        font: inherit;
      }

      .agreement-check {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
      }

      .agreement-reader {
        display: grid;
        gap: 12px;
      }

      .agreement-reader h2 {
        margin: 0;
        color: var(--green-dark);
        font-size: 1.05rem;
      }

      .agreement-scroll {
        max-height: min(420px, 56vh);
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #f9fcfb;
        padding: 18px;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
        min-height: 200px;
        font-size: 1rem;
        line-height: 1.6;
      }

      .agreement-scroll .agreement {
        border: 0;
        background: transparent;
        padding: 0;
      }

      .agreement-scroll:focus {
        outline: 3px solid rgba(7, 95, 93, 0.18);
        outline-offset: 2px;
      }

      .agreement-scroll section + section {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .agreement-scroll h3 {
        margin: 0 0 8px;
        color: var(--green-dark);
        font-size: 1rem;
      }

      .agreement-scroll p,
      .agreement-scroll li {
        color: var(--ink);
      }

      .agreement-scroll ul {
        margin: 0;
        padding-left: 20px;
      }

      .agreement-scroll li + li {
        margin-top: 8px;
      }

      .agreement-scroll .agreement-time-warning {
        padding: 15px 16px;
        background: linear-gradient(135deg, #fff8e8, #fffdf7);
        border: 2px solid #d9a334;
        border-radius: 12px;
      }

      .agreement-scroll .agreement-time-warning h2 {
        color: #704600;
        font-size: .82rem;
        letter-spacing: .055em;
        text-transform: uppercase;
      }

      .agreement-scroll .agreement-time-warning h3 {
        margin-top: 13px;
        font-size: .72rem;
        letter-spacing: .04em;
        text-transform: uppercase;
      }

      .agreement-scroll .agreement-warning-title {
        color: var(--green-dark);
        font-weight: 800;
      }

      .agreement-unlock-note {
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 700;
      }

      .agreement-unlock-note[data-ready="true"] {
        color: var(--green-dark);
      }

      .signature-panel {
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #ffffff;
        padding: 16px;
      }

      .signature-panel p {
        font-size: 0.92rem;
      }

      .agreement-check input {
        margin-top: 4px;
      }

      .agreement-check:has(input:disabled) {
        opacity: 0.68;
      }

      .agreement-check a {
        color: var(--green-dark);
        font-weight: 900;
      }

      button {
        min-height: 48px;
        width: fit-content;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #08736f, var(--green));
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 0 24px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }

      .status {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #f9fcfb;
        padding: 14px 16px;
        color: var(--green-dark);
        font-weight: 800;
      }

      .status[data-status="error"] {
        border-color: rgba(169, 49, 49, 0.28);
        background: #fff5f5;
        color: var(--danger);
      }

      @media (max-width: 680px) {
        .agreement-dialog { width: calc(100% - 16px); max-height: calc(100dvh - 16px); }
        .agreement-dialog-head, #approvalForm { padding: 18px; }
        .package-list { grid-template-columns: 1fr; }
        .quote-facts { grid-template-columns: 1fr; }
        .quote-fact + .quote-fact { border-top: 1px solid var(--line); border-left: 0; }
        .panel { border-radius: 20px; }
        .estimate-card { padding: 20px; }
        .estimate-payment { position: static; }
        .summary-row {
          grid-template-columns: 1fr;
          gap: 2px;
        }

        button {
          width: 100%;
        }
      }
      .booking-appointment-details { display: grid; gap: 9px; margin: 0; }
      .booking-appointment-details div { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; }
      .booking-appointment-details dt { color: #607477; font-size: .84rem; font-weight: 700; }
      .booking-appointment-details dd { margin: 0; color: #123d43; font-size: .9rem; font-weight: 700; }
      .booking-appointment-details dd span { color: #607477; font-weight: 500; }
      .quote-customer-box { border: 1px solid #cfe0dc; border-radius: 14px; background: #f8fbfa; padding: 18px; }
      .quote-customer-box h3 { margin: 0 0 14px; }
      .quote-customer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 0; }
      .quote-customer-grid div { min-width: 0; }
      .quote-customer-grid dt { margin-bottom: 3px; color: #607477; font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
      .quote-customer-grid dd { margin: 0; color: #123d43; font-size: .9rem; font-weight: 700; overflow-wrap: anywhere; }
      .quote-live-calendar { margin-top: 16px; padding-top: 16px; border-top: 1px solid #dce8e4; }
      .quote-live-calendar h4 { margin: 0 0 6px; color: #123d43; }
      .quote-live-calendar > p { margin: 0 0 12px; font-size: .86rem; }
      .quote-calendar-dates, .quote-calendar-times { display: flex; flex-wrap: wrap; gap: 8px; }
      .quote-calendar-dates button, .quote-calendar-times button { min-height: 40px; width: auto; padding: 8px 12px; border: 1px solid #b9ceca; border-radius: 10px; background: #fff; color: #0a555b; font-size: .84rem; }
      .quote-calendar-dates button.is-selected, .quote-calendar-times button.is-selected { border-color: #075f5d; background: #075f5d; color: #fff; }
      .quote-calendar-times { margin-top: 12px; }
      .quote-calendar-status { margin-top: 10px !important; color: #075f5d !important; font-weight: 700; }
      .booking-wizard-dialog[data-current-step="2"] .booking-form { padding-bottom: 46px; }
      .booking-quote-step { padding-top: 22px; }
      .booking-quote-head { margin-bottom: 22px; }
      .booking-quote-head h2 { font-size: clamp(1.7rem, 3vw, 2.15rem); line-height: 1.12; letter-spacing: -.03em; }
      .booking-quote-next { margin-bottom: 9px; font-size: .68rem; }
      .booking-quote-layout { gap: clamp(22px, 3vw, 36px); }
      .booking-quote-details-column { gap: 14px; }
      .booking-quote-section { padding: 19px 21px; border-radius: 16px; }
      .booking-quote-section h3 { margin-bottom: 11px; font-size: 1rem; }
      .booking-quote-section li, .booking-quote-section p { font-size: .84rem; }
      .booking-quote-summary { padding: 23px; border-radius: 19px; }
      .booking-quote-total { font-size: clamp(2rem, 3.4vw, 2.45rem); }
      .booking-payment-schedule h3 { font-size: 1.04rem; }
      .booking-quote-step .booking-price-breakdown summary { padding: 14px 17px; font-size: .86rem; }
      .booking-important-note { padding: 15px 17px; }
      .booking-important-note p { font-size: .76rem; }
      .booking-quote-appointment { min-height: 46px; font-size: .88rem; }
      .agreement-dialog { width: min(690px, calc(100% - 32px)); border-radius: 16px; box-shadow: 0 24px 70px rgba(0, 33, 39, .28); }
      .agreement-dialog-head { align-items: center; padding: 16px 20px; border-top: 4px solid #0b7880; }
      .agreement-dialog-head h2 { font-size: 1.28rem; letter-spacing: -.02em; }
      .agreement-dialog-head button { flex-basis: 34px; width: 34px; min-height: 34px; font-size: 1.1rem; }
      #approvalForm { gap: 14px; padding: 17px 20px 19px; }
      .agreement-reader { gap: 8px; }
      .agreement-reader > h2 { font-size: .92rem; }
      .agreement-reader > p { font-size: .76rem; line-height: 1.45; }
      .agreement-scroll { max-height: min(330px, 46vh); min-height: 170px; padding: 15px 17px; border-radius: 12px; font-size: .78rem; line-height: 1.52; }
      .agreement-scroll .agreement h1 { font-size: 1.08rem; line-height: 1.25; }

  <body class="booking-page booking-wizard-open">
    <main id="main">
      <div class="booking-wizard-gate is-quote-page">
        <div class="booking-wizard-backdrop" aria-hidden="true"></div>
        <section class="booking-wizard-dialog" data-current-step="2" aria-labelledby="estimateTitle">
          <div class="booking-wizard-toolbar">
            <button type="button" aria-label="Close quote">×</button>
          </div>
          <div class="booking-form">
            <section class="booking-step booking-quote-step">
              <div class="booking-quote-head">
                <span class="booking-quote-next">Quote ready <i>·</i> Appointment selected</span>
                <h2 id="estimateTitle">Your cleaning estimate</h2>
              </div>
              <div class="quote-summary" id="quoteSummary"></div>
            </section>
          </div>
        </section>
      </div>
    </main>

    <dialog class="agreement-dialog" id="agreementDialog" aria-labelledby="agreementDialogTitle">
      <div class="agreement-dialog-head">
        <div><h2 id="agreementDialogTitle">Review the Service Agreement</h2></div>
        <button type="button" id="closeAgreement" aria-label="Back to estimate">×</button>
      </div>
        <form id="approvalForm" hidden>
          <section class="agreement-reader" aria-labelledby="agreementReaderTitle">
            <h2 id="agreementReaderTitle">Service agreement</h2>
            <p>Scroll through the agreement below before checking the agreement box. You can also <a id="agreementLink" href="agreement.html" target="_blank" rel="noopener">open the full agreement in a new tab</a>.</p>
            <div class="agreement-scroll" id="agreementScroll" tabindex="0" aria-label="Scrollable service agreement">
              <p>Loading service agreement...</p>
            </div>
          </section>

          <label class="agreement-check">
            <input name="agreementAccepted" type="checkbox" required disabled />
            <span id="agreementAcceptance">
              I have read, understood, and agree to the Iman Cleaning Service LLC Service Agreement.
            </span>
          </label>
          <input name="agreementScrolled" type="hidden" value="false" />

          <label class="signature-panel">
            Electronic signature
            <input name="agreementSignature" type="text" autocomplete="name" required minlength="2" maxlength="160" placeholder="Type your full legal name" />
          </label>

          <div class="status" id="status" role="status" aria-live="polite" hidden></div>
          <div class="agreement-actions">
            <button class="agreement-back" type="button" id="backToEstimate">← Back to estimate</button>
            <button type="submit" id="acceptAgreement" disabled>Agree &amp; continue</button>
          </div>
        </form>
    </dialog>

    <div data-site-footer></div>
    <script src="./site-footer.js?v=20260827-unified-footer"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";
      const pathCode = window.location.pathname.match(/^\/q\/([A-Za-z0-9_-]{12})\/?$/)?.[1] || "";
      const code = params.get("code") || pathCode;
      let quoteRevision = "";
      const summary = document.querySelector("#quoteSummary");
      const form = document.querySelector("#approvalForm");
      const statusBox = document.querySelector("#status");
      const agreementLink = document.querySelector("#agreementLink");
      const agreementScroll = document.querySelector("#agreementScroll");
      const agreementUnlockNote = document.querySelector("#agreementUnlockNote");
      const agreementDialog = document.querySelector("#agreementDialog");
      const closeAgreement = document.querySelector("#closeAgreement");
      const backToEstimate = document.querySelector("#backToEstimate");
      const acceptAgreement = document.querySelector("#acceptAgreement");
      let agreementLoaded = false;
      let agreementLoading = null;
      let quoteReady = false;
      let checkoutPending = false;
      let agreementReturnFocus = null;
      let confirmedAgreement = null;
      let scheduleRequired = false;
      let selectedSchedule = "";
      let availableSlots = [];
      let calendarOpened = false;
      let calendarMonthIndex = 0;
      let selectedCalendarDate = "";

      function canAcceptAgreement() {
        const signature = form.agreementSignature.value.trim();
        return quoteReady && agreementLoaded && form.agreementScrolled.value === "true"
          && form.agreementAccepted.checked && signature.length >= 2 && signature.length <= 160;
      }

      function hasConfirmedAgreement() {
        return canAcceptAgreement() && confirmedAgreement?.revision === quoteRevision
          && confirmedAgreement?.signature === form.agreementSignature.value.trim();
      }

      function syncPaymentButton() {
        acceptAgreement.disabled = checkoutPending || !canAcceptAgreement();
        const paymentButton = document.querySelector("#payDeposit");
        const reviewButton = document.querySelector("[data-open-agreement-review]");
        const accepted = hasConfirmedAgreement();
        if (paymentButton) paymentButton.disabled = checkoutPending || agreementDialog.open || !accepted;
        if (reviewButton) {
          reviewButton.disabled = checkoutPending;
          reviewButton.classList?.toggle?.("is-accepted", accepted);
          const reviewCopy = reviewButton.querySelector?.("[data-agreement-review-button-copy]");
          if (reviewCopy) reviewCopy.textContent = scheduleRequired && !selectedSchedule ? "Choose an appointment" : accepted ? "Preparing secure payment" : "Review agreement & pay";
        }
        const reviewStatus = document.querySelector("#agreementReviewStatus");
        if (reviewStatus) reviewStatus.hidden = Boolean(accepted);
      }

      async function openAgreementReview() {
        if (!quoteReady || checkoutPending || agreementDialog.open) return;
        agreementReturnFocus = document.activeElement;
        form.hidden = false;
        statusBox.hidden = true;
        agreementDialog.showModal();
        document.body.classList.add("quote-agreement-open");
        syncPaymentButton();
        agreementScroll.focus();
        try {
          if (!agreementLoaded) {
            if (!agreementLoading) agreementLoading = loadAgreement().finally(() => { agreementLoading = null; });
            await agreementLoading;
          }
          unlockAgreementIfScrolled();
        } catch (error) {
          setStatus("The agreement could not be loaded. Go back to your estimate and try again. Payment is unavailable until the agreement loads.", "error");
        }
        syncPaymentButton();
      }

      function returnToEstimate() {
        if (!checkoutPending) agreementDialog.close();
      }

      summary.addEventListener("click", event => {
        if (event.target.closest("[data-open-agreement-review]")) {
          if (scheduleRequired && !selectedSchedule) {
            calendarOpened = true;
            const calendar = document.querySelector("[data-quote-calendar]");
            if (calendar) {
              calendar.hidden = false;
              renderQuoteCalendar();
              calendar.scrollIntoView({ behavior: "smooth", block: "start" });
              document.querySelector("[data-quote-calendar-prev]")?.focus();
            }
          } else if (hasConfirmedAgreement()) startSecurePayment();
          else openAgreementReview();
        }
      });
      closeAgreement.addEventListener("click", returnToEstimate);
      backToEstimate.addEventListener("click", returnToEstimate);
      agreementDialog.addEventListener("cancel", event => { if (checkoutPending) event.preventDefault(); });
      agreementDialog.addEventListener("close", () => {
        document.body.classList.remove("quote-agreement-open");
        syncPaymentButton();
        agreementReturnFocus?.focus?.();
      });
      const invalidateAgreementConfirmation = () => { confirmedAgreement = null; syncPaymentButton(); };
      form.agreementAccepted.addEventListener("change", invalidateAgreementConfirmation);
      form.agreementSignature.addEventListener("input", invalidateAgreementConfirmation);

      function decodeTokenPayload(value) {
        const encoded = String(value).split(".")[0] || "";
        const normalized = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const json = atob(normalized.padEnd(normalized.length + ((4 - normalized.length % 4) % 4), "="));
        return JSON.parse(json);
      }

      function money(cents) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD"
        }).format(Number(cents || 0) / 100);
      }

      function percentAmount(cents, percent) {
        return Math.max(1, Math.round(Number(cents || 0) * percent));
      }

      function appointmentDate(value) {
        const date = new Date(`${value}T12:00:00Z`);
        return Number.isFinite(date.getTime()) ? new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(date) : value || "";
      }

      function appointmentTime(value) {
        const time = String(value || "").match(/^([01]\d|2[0-3]):([0-5]\d)$/);
        return time ? `${Number(time[1]) % 12 || 12}:${time[2]} ${Number(time[1]) < 12 ? "AM" : "PM"}` : value || "";
      }

      function renderQuoteCalendar() {
        const monthLabel = document.querySelector("[data-quote-calendar-month]");
        const dates = document.querySelector("[data-quote-calendar-dates]");
        const previous = document.querySelector("[data-quote-calendar-prev]");
        const next = document.querySelector("[data-quote-calendar-next]");
        const status = document.querySelector("[data-quote-calendar-status]");
        if (!monthLabel || !dates || !status) return;
        const months = [...new Set(availableSlots.map(slot => slot.date.slice(0, 7)))];
        const month = months[calendarMonthIndex] || "";
        dates.replaceChildren();
        if (!availableSlots.length) { status.textContent = "No online appointments are currently available. Please call (929) 232-1930."; return; }
        const [year, monthNumber] = month.split("-").map(Number);
        monthLabel.textContent = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" }).format(new Date(year, monthNumber - 1, 1, 12));
        const firstDay = new Date(year, monthNumber - 1, 1).getDay();
        const dayCount = new Date(year, monthNumber, 0).getDate();
        for (let index = 0; index < firstDay; index += 1) {
          const spacer = document.createElement("span"); spacer.className = "booking-calendar-empty"; spacer.setAttribute("aria-hidden", "true"); dates.append(spacer);
        }
        for (let day = 1; day <= dayCount; day += 1) {
          const date = `${year}-${String(monthNumber).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const slotCount = availableSlots.filter(slot => slot.date === date).length;
          const button = document.createElement("button");
          button.type = "button"; button.textContent = String(day); button.disabled = !slotCount;
          button.className = `${slotCount ? "is-available" : "is-unavailable"}${selectedCalendarDate === date ? " is-selected" : ""}`;
          button.setAttribute("aria-label", slotCount ? `${appointmentDate(date)}, ${slotCount} available time${slotCount === 1 ? "" : "s"}` : `${day}, unavailable`);
          if (slotCount) button.addEventListener("click", () => { selectedSchedule = ""; selectedCalendarDate = date; renderQuoteCalendar(); renderQuoteCalendarTimes(date); });
          dates.append(button);
        }
        if (previous) previous.disabled = calendarMonthIndex === 0;
        if (next) next.disabled = calendarMonthIndex >= months.length - 1;
        if (previous) previous.onclick = () => {
          if (calendarMonthIndex <= 0) return;
          calendarMonthIndex -= 1; selectedCalendarDate = ""; selectedSchedule = ""; renderQuoteCalendar(); renderQuoteCalendarTimes(""); syncPaymentButton();
        };
        if (next) next.onclick = () => {
          if (calendarMonthIndex >= months.length - 1) return;
          calendarMonthIndex += 1; selectedCalendarDate = ""; selectedSchedule = ""; renderQuoteCalendar(); renderQuoteCalendarTimes(""); syncPaymentButton();
        };
        if (selectedCalendarDate) renderQuoteCalendarTimes(selectedCalendarDate);
      }

      function renderQuoteCalendarTimes(date) {
        const times = document.querySelector("[data-quote-calendar-times]");
        const status = document.querySelector("[data-quote-calendar-status]");
        if (!times || !status) return;
        times.replaceChildren();
        if (!date) {
          times.innerHTML = '<p class="booking-time-empty">Choose a highlighted date from the calendar.</p>';
          status.textContent = "Select an available date, then choose a time.";
          return;
        }
        availableSlots.filter(slot => slot.date === date).forEach(slot => {
          const button = document.createElement("button");
          button.type = "button"; button.className = `booking-time-slot${selectedSchedule === slot.value ? " is-selected" : ""}`;
          button.innerHTML = `<strong>${escapeHtml(appointmentTime(slot.time))}</strong><span>${selectedSchedule === slot.value ? "Selected" : "Available"}</span>`;
          button.addEventListener("click", () => {
            selectedSchedule = slot.value;
            renderQuoteCalendarTimes(date);
            status.textContent = `${appointmentDate(slot.date)} at ${appointmentTime(slot.time)} selected.`;
            syncPaymentButton();
          });
          times.append(button);
        });
        if (!selectedSchedule) status.textContent = `Choose an available time on ${appointmentDate(date)}.`;
      }

      function setStatus(message, type = "info") {
        statusBox.hidden = false;
        statusBox.dataset.status = type;
        statusBox.textContent = message;
      }

      function unlockAgreementIfScrolled() {
        if (!agreementScroll || !form || !agreementLoaded || !agreementDialog.open) return;
        const isAtBottom = agreementScroll.scrollTop + agreementScroll.clientHeight >= agreementScroll.scrollHeight - 8;
        if (!isAtBottom) return;

        form.agreementAccepted.disabled = false;
        form.agreementScrolled.value = "true";
        if (agreementUnlockNote) {
          agreementUnlockNote.dataset.ready = "true";
          agreementUnlockNote.textContent = "Agreement reviewed. You can now check the box.";
        }
        syncPaymentButton();
      }

      if (agreementScroll) {
        agreementScroll.addEventListener("scroll", unlockAgreementIfScrolled);
        window.addEventListener("load", unlockAgreementIfScrolled);
      }

      async function loadAgreement() {
        if (!agreementScroll) return;
        try {
          const response = await fetch(agreementLink.href, { cache: "no-store" });
          if (!response.ok) throw new Error("Agreement could not be loaded.");
          const html = await response.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          const agreement = doc.querySelector(".agreement");
          if (!agreement) throw new Error("Agreement content could not be found.");
          agreementScroll.innerHTML = "";
          agreementScroll.appendChild(agreement);
          agreementScroll.scrollTop = 0;
          agreementLoaded = true;
          unlockAgreementIfScrolled();
        } catch (error) {
          agreementLoaded = false;
          form.agreementAccepted.checked = false;
          form.agreementAccepted.disabled = true;
          form.agreementScrolled.value = "false";
          agreementScroll.innerHTML = "<p>The agreement could not be loaded. Please refresh this page before continuing to payment.</p>";
          throw error;
        }
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]);
      }

      async function initializeQuote() {
        form.hidden = true;
        quoteReady = false;
        try {
          let quote;
          {
            const query = code ? `code=${encodeURIComponent(code)}` : `token=${encodeURIComponent(token)}`;
            const response = await fetch(`/api/quote/resolve-approval?${query}`, {
              headers: { "Accept": "application/json" },
              cache: "no-store"
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.quote) throw new Error(data.error || "Invalid quote approval link.");
            quote = data.quote;
            availableSlots = Array.isArray(data.slots) ? data.slots : [];
          }
          quoteRevision = quote.revision || "";
        if (quote.agreementUrl) {
          agreementLink.href = quote.agreementUrl;
        }
        const depositCents = percentAmount(quote.amountCents, 0.25);
        const rushFeeCents = Number(quote.rushFeeCents || 0);
        const remainingCents = Math.max(0, Number(quote.amountCents || 0) - depositCents);
        const dueNowCents = depositCents + rushFeeCents;
        const totalCents = Number(quote.amountCents || 0) + rushFeeCents;
        const workers = Number(quote.cleanerCount || 0);
        const hours = workers > 0 ? Number((Number(quote.laborHours || 0) / workers).toFixed(2)) : 0;
        const items = String(quote.packageItems || "").split(/\r?\n/).map(item => item.trim()).filter(Boolean);
        const units = Array.isArray(quote.units) ? quote.units : [];
        const pricing = quote.pricing;
        const automaticBalance = !rushFeeCents && quote.balanceCollection === "automatic_48h_authorization";
        const priceLine = (label, value) => `<div class="price-line"><span>${escapeHtml(label)}</span><strong>${money(value)}</strong></div>`;
        document.querySelector("#estimateTitle").textContent = `Your ${quote.service || "Cleaning"} Estimate`;
        summary.innerHTML = `
          <div class="booking-quote-layout">
            <div class="booking-quote-details-column">
              <section class="booking-quote-section"><h3>Your cleaning package</h3>
                ${units.map(unit => `<div class="package-unit"><h3>${escapeHtml(unit.name)}</h3><ul class="package-list">${unit.items.map(item => `<li>${item.quantity} × ${escapeHtml(item.name)}</li>`).join("")}</ul></div>`).join("")}
                ${items.length ? `<div class="package-unit"><ul class="package-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div>` : units.length ? "" : `<p>${escapeHtml(quote.service || "Cleaning service")}</p>`}
                ${quote.serviceDescriptionUrl ? `<a class="service-description-link" href="${escapeHtml(quote.serviceDescriptionUrl)}" target="_blank" rel="noopener noreferrer">View complete service description <span aria-hidden="true">↗</span></a>` : ""}
              </section>
              <details class="booking-price-breakdown" open><summary>View itemized pricing <span aria-hidden="true">⌄</span></summary><div class="booking-price-breakdown-content"><dl>
                ${units.flatMap(unit => [
                  `<div><dt><strong>${escapeHtml(unit.name || "Service unit")}</strong></dt><dd aria-hidden="true"></dd></div>`,
                  ...(Array.isArray(unit.items) ? unit.items.map(item => `<div><dt>${escapeHtml(`${item.quantity} × ${item.name}`)}</dt><dd>${money(item.lineTotalCents)}</dd></div>`) : [])
                ]).join("")}
                ${pricing ? `<div><dt>${units.length ? "All units, before tax" : "Cleaning service before tax"}</dt><dd>${money(pricing.subtotalCents)}</dd></div>` : ""}
                ${rushFeeCents ? `<div><dt>Same-day rush fee</dt><dd>${money(rushFeeCents)}</dd></div>` : ""}
                ${pricing ? `<div><dt>NY sales tax (8.875%)</dt><dd>${money(pricing.taxCents)}</dd></div>` : ""}
                ${pricing?.discountCents ? `<div><dt>${escapeHtml(pricing.discountLabel || "Discount")} (after tax)</dt><dd>-${money(pricing.discountCents)}</dd></div>` : ""}
                <div class="booking-price-breakdown-total"><dt>Total estimated price</dt><dd>${money(totalCents)}</dd></div>
              </dl></div></details>
              <section class="booking-quote-section quote-customer-box">
                <h3>Customer information</h3>
                <dl class="quote-customer-grid">
                  <div><dt>Customer name</dt><dd>${escapeHtml(quote.customerName || "Not provided")}</dd></div>
                  <div><dt>Service address</dt><dd>${escapeHtml(quote.serviceLocation || "Not provided")}</dd></div>
                  <div><dt>Phone number</dt><dd>${escapeHtml(quote.customerPhone || "Not provided")}</dd></div>
                  <div><dt>Email address</dt><dd>${escapeHtml(quote.customerEmail || "Not provided")}</dd></div>
                </dl>
              </section>
              <section class="booking-quote-section booking-selected-appointment">
                ${quote.serviceDate ? `<h3>Your selected appointment</h3>
                <p class="booking-appointment-lock"><strong>Appointment date and time are set by IMAN Cleaning Service and cannot be edited from this payment link.</strong></p>
                <dl class="booking-appointment-details">
                  ${quote.customerName ? `<div><dt>Customer</dt><dd>${escapeHtml(quote.customerName)}</dd></div>` : ""}
                  ${quote.serviceLocation ? `<div><dt>Service address</dt><dd>${escapeHtml(quote.serviceLocation)}</dd></div>` : ""}
                  <div><dt>Date</dt><dd>${escapeHtml(appointmentDate(quote.serviceDate))}</dd></div>
                  <div><dt>Start time</dt><dd>${escapeHtml(appointmentTime(quote.serviceTime))} <span>(New York time)</span></dd></div>
                </dl>` : `<div class="quote-live-calendar" data-quote-calendar hidden>
                  <div class="booking-step-head"><h2>Choose your date and time</h2></div>
                  <div class="booking-scheduler">
                    <section class="booking-calendar-panel" aria-labelledby="quote-calendar-title">
                      <div class="booking-scheduler-heading"><span class="booking-scheduler-step">1</span><div><h3 id="quote-calendar-title">Choose a date</h3><p>Available dates are highlighted.</p></div></div>
                      <div class="booking-calendar-toolbar"><button type="button" data-quote-calendar-prev aria-label="Show previous month">←</button><strong data-quote-calendar-month aria-live="polite"></strong><button type="button" data-quote-calendar-next aria-label="Show next month">→</button></div>
                      <div class="booking-calendar-weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                      <div class="booking-calendar-grid" data-quote-calendar-dates role="group" aria-label="Available cleaning dates"></div>
                    </section>
                    <section class="booking-time-panel" aria-labelledby="quote-time-title">
                      <div class="booking-scheduler-heading"><span class="booking-scheduler-step">2</span><div><h3 id="quote-time-title">Choose a time</h3><p>Select a date to see available times.</p></div></div>
                      <div class="booking-time-slots" data-quote-calendar-times role="radiogroup" aria-label="Available cleaning times"><p class="booking-time-empty">Choose a highlighted date from the calendar.</p></div>
                    </section>
                  </div>
                  <p class="quote-calendar-status" data-quote-calendar-status role="status">Select an available date, then choose a time.</p>
                </div>`}
              </section>
              <aside class="booking-important-note booking-time-warning" role="note" aria-labelledby="timeBudgetNoticeTitle"><div class="booking-warning-head"><div class="booking-warning-label"><span aria-hidden="true">!</span> Please read before payment</div><strong id="timeBudgetNoticeTitle">Your time and budget stay in your control</strong><p>Your estimate is based on the information, photos, videos, and details provided before your appointment. We do our best to estimate the required cleaning time accurately; however, the full condition and scope of work can only be confirmed once our cleaning team sees the property in person.</p></div><div class="booking-warning-points"><section class="booking-warning-point is-condition"><span>Property conditions</span><p>If the actual condition, level of buildup, or work required differs from what could reasonably be determined beforehand, the service may require additional time.</p></section><section class="booking-warning-point is-approval"><span>Approval before extra time</span><p class="booking-time-limit">Your cleaning team will work within the maximum labor-hours shown in your estimate. The service may be completed sooner. If additional time is recommended, we’ll explain why and get your approval before continuing.</p></section><section class="booking-warning-point is-price"><span>No surprise charges</span><p>The total price for any additional time will be shown for your approval and will <strong>never be added without your permission.</strong></p></section></div><p class="booking-warning-contact">Please confirm your address and appointment details before making payment. If anything needs to be updated, contact us at <strong><a href="tel:+19292321930">(929) 232-1930</a></strong>.</p></aside>
            </div>
            <aside class="booking-quote-summary" aria-label="Quote and booking summary">
              <span>Estimated total</span><strong class="booking-quote-total">${money(totalCents)}</strong>
              ${workers && hours ? `<div class="booking-summary-labor"><strong>${escapeHtml(quote.laborHours)} labor-hours maximum</strong><span>${workers} cleaner${workers === 1 ? "" : "s"} for up to ${hours} hour${hours === 1 ? "" : "s"} each</span></div>` : ""}
              <section class="booking-payment-schedule"><h3>Reserve your cleaning for <strong>${money(dueNowCents)}</strong></h3><p>The remaining <strong>${money(remainingCents)} is due after your cleaning.</strong></p></section>
              <button class="booking-primary booking-quote-appointment" type="button" data-open-agreement-review aria-haspopup="dialog" aria-controls="agreementDialog"><span data-agreement-review-button-copy>Review agreement &amp; pay</span> →</button>
              <ul class="booking-quote-trust-list"><li>Secure checkout</li><li>No extra charges without your approval</li>${!rushFeeCents ? `<li>Plans change? Reschedule or cancel 48+ hours ahead—your deposit is fully refundable</li>` : ""}</ul>
              ${automaticBalance ? `<p class="booking-authorization-note">A temporary hold for ${money(remainingCents)} is placed about 48 hours before your appointment and charged only after completion.</p>` : ""}
              <div class="booking-status booking-saved-quote-status" id="checkoutStatus" role="status" aria-live="polite" hidden></div>
              <button type="button" id="payDeposit" disabled hidden>Pay ${money(dueNowCents)} &amp; confirm booking</button>
            </aside>
          </div>`;
        if (automaticBalance) {
          document.querySelector("#agreementAcceptance").textContent = "I have reviewed and agree to the Service Agreement and payment terms. I authorize the 25% deposit, the remaining-balance authorization shown on this quote, and any customer-caused access charge described in the agreement.";
        }
          scheduleRequired = !quote.serviceDate;
          if (scheduleRequired) renderQuoteCalendar();
          quoteReady = true;
          syncPaymentButton();
        } catch (error) {
          summary.textContent = error.message || "This quote link is invalid or expired. Please contact Iman Cleaning Service LLC for a new link.";
          form.hidden = true;
        }
      }

      initializeQuote();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (checkoutPending || !quoteReady || !agreementDialog.open) return;
        if (!form.reportValidity()) return;
        if (!canAcceptAgreement()) {
          setStatus("Please scroll to the bottom of the service agreement before checking out.", "error");
          agreementScroll?.focus();
          return;
        }
        confirmedAgreement = { revision: quoteRevision, signature: form.agreementSignature.value.trim() };
        agreementReturnFocus = document.querySelector("[data-open-agreement-review]");
        returnToEstimate();
        syncPaymentButton();
        startSecurePayment();
      });

      async function startSecurePayment() {
        if (checkoutPending || !quoteReady || agreementDialog.open || !hasConfirmedAgreement()) return;
        const paymentButton = document.querySelector("#payDeposit");
        const checkoutStatus = document.querySelector("#checkoutStatus");
        const paymentLabel = paymentButton.textContent;
        const showCheckoutStatus = (message, type) => {
          checkoutStatus.hidden = false;
          checkoutStatus.dataset.status = type;
          checkoutStatus.textContent = message;
        };

        checkoutPending = true;
        syncPaymentButton();
        paymentButton.textContent = "Preparing payment...";
        showCheckoutStatus("Preparing secure payment...", "info");

        try {
          const formData = new FormData();
          if (code) formData.append("code", code);
          else formData.append("token", token);
          formData.append("revision", quoteRevision);
          formData.append("agreementScrolled", form.agreementScrolled.value);
          formData.append("agreementAccepted", form.agreementAccepted.checked ? "true" : "false");
          formData.append("agreementSignature", confirmedAgreement.signature);
          if (scheduleRequired) formData.append("selectedSchedule", selectedSchedule);

          const response = await fetch("/api/quote/approve-checkout", {
            method: "POST",
            body: formData
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "Payment could not be prepared.");
          }

          window.location.href = data.checkoutUrl;
        } catch (error) {
          showCheckoutStatus(error.message || "Payment could not be prepared. Please try again.", "error");
          checkoutPending = false;
          paymentButton.textContent = paymentLabel;
          syncPaymentButton();
        }
      }
    </script>
