<script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "CleaningService",
  "name": "Iman Cleaning Service LLC",
  "url": "https://www.imancleaningservice.com/",

  "priceRange": "$$",
  "address": {

    "addressLocality": "Queens",
    "addressRegion": "NY",
    "addressCountry": "US"
  },
  "areaServed": [
    { "@type": "City", "name": "Manhattan" },
    { "@type": "City", "name": "Brooklyn" },
    { "@type": "City", "name": "Queens" },
    { "@type": "City", "name": "The Bronx" },

    { "@type": "AdministrativeArea", "name": "Long Island" }
  ],
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
    "opens": "08:00", "closes": "20:00"
  }],
  "contactPoint": [

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./_ds_bundle.js"></script>
<script src="./data.js"></script>
<script type="text/babel" src="./chrome.jsx?v=20260810-free-estimate"></script>
<script type="text/babel">
const mount = () => {
  if (!window.ImanChrome) return setTimeout(mount, 30);
  const { Icon, Header, Footer } = window.ImanChrome;
  const D = window.IMAN_DATA;

  const cards = [
    { icon: "phone", h: "Call us", v: D.phone, href: D.phoneHref },
    { icon: "mail", h: "Email", v: "Info@imancleaningservice.com", href: "mailto:Info@imancleaningservice.com" },
    { icon: "clock", h: "Hours", v: "Open 24 hours · 7 days a week" },
  ];

  function Page() {
    React.useEffect(() => {
      const handleQuoteFrameMessage = (event) => {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== "imanQuoteFrameHeight") return;
        const frame = document.querySelector(".contact-quote-frame");
        const height = Math.max(560, Math.min(Number(event.data.height) || 0, 5000));
        if (frame) frame.style.height = `${height}px`;
      };
      window.addEventListener("message", handleQuoteFrameMessage);
      return () => window.removeEventListener("message", handleQuoteFrameMessage);
    }, []);

    return (<>
      <Header active="contact" onDark />
      <section className="page-hero on-photo" style={{ "--hero-img": "url('./assets/contact-office-hero.png')" }}>
        <div className="ds-shell page-hero-inner">
          <span className="ds-kicker">Contact Iman Cleaning Service LLC</span>
          <h1>Get in Touch</h1>
          <p className="ds-lead">Have questions, need a free cleaning quote, or want to schedule a service? Contact our team by phone, text, email, or the quote form below. We're committed to providing prompt, friendly support for homes and businesses throughout New York City and Long Island.</p>
        </div>
      </section>

      <section className="section-tight">
        <div className="ds-shell contact-grid">
          <div className="contact-quote-embed" aria-label="Cleaning quote request form">
            <div className="contact-quote-intro">
              <h2>Get a Detailed Quote by Answering a Few Questions</h2>
            </div>
            <iframe
              className="contact-quote-frame"
              title="Cleaning quote request form"
              src="./quote.html?embed=contact"
              loading="eager"
              scrolling="no"
            ></iframe>
          </div>

          <aside style={{ display: "grid", gap: 16 }}>
            <div className="contact-cards">
              {cards.map((c) => (
                <div className="contact-card" key={c.h}>
                  <span className="footer-ico"><Icon name={c.icon} size={20} stroke="var(--teal-700)" /></span>
                  <h4>{c.h}</h4>
                  {c.href ? <a href={c.href}>{c.v}</a> : <p>{c.v}</p>}
                </div>
              ))}
            </div>
          </aside>
        </div>
      </section>

      <Footer />
    </>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
};
mount();
</script>

</body>
</html>
