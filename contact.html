<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CleaningService",
  "name": "Iman Cleaning Service LLC",
  "url": "https://www.imancleaningservice.com/",
  "logo": "https://www.imancleaningservice.com/iman-logo-icon.png",
  "image": "https://www.imancleaningservice.com/iman-logo-source.png",
  "email": "Info@imancleaningservice.com",
  "telephone": "+1-929-803-4053",
  "priceRange": "$$",
  "address": { "@type": "PostalAddress", "addressLocality": "New York", "addressRegion": "NY", "addressCountry": "US" },
  "areaServed": [
    { "@type": "City", "name": "Manhattan" },
    { "@type": "City", "name": "Brooklyn" },
    { "@type": "City", "name": "Queens" },
    { "@type": "City", "name": "The Bronx" },
    { "@type": "City", "name": "Staten Island" }
  ],
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
    "opens": "06:00", "closes": "20:00"
  }],
  "contactPoint": [
    { "@type": "ContactPoint", "telephone": "+1-929-803-4053", "contactType": "customer service", "areaServed": "US", "availableLanguage": "English" },
    { "@type": "ContactPoint", "telephone": "+1-636-253-2035", "contactType": "customer service", "areaServed": "US", "availableLanguage": "English" }
  ]

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./_ds_bundle.js"></script>
<script src="./data.js"></script>
<script type="text/babel" src="./chrome.jsx"></script>
<script type="text/babel">
const mount = () => {
  if (!window.ImanChrome) return setTimeout(mount, 30);
  const { Button, Badge, Field } = window.ImanCleaningDesignSystem_5652ad;
  const { Icon, Header, Footer } = window.ImanChrome;
  const D = window.IMAN_DATA;

  const cards = [
    { icon: "phone", h: "Call or text", v: D.phone, href: D.phoneHref },
    { icon: "mail", h: "Email", v: "Info@imancleaningservice.com", href: "mailto:Info@imancleaningservice.com" },
    { icon: "clock", h: "Hours", v: "6 AM – 8 PM · 7 days" },
    { icon: "pin", h: "Service area", v: "All five NYC boroughs" },
  ];

  function Page() {
    const [goal, setGoal] = React.useState(0);
    const goals = ["Keep my home clean", "Extra attention", "Turnover / commercial"];
    return (<>
      <Header active="contact" onDark />
      <section className="page-hero on-photo" style={{ "--hero-img": "url('./assets/contact-office-hero.png')" }}>
        <div className="ds-shell page-hero-inner">
          <span className="ds-kicker">We're easy to reach</span>
          <h1>Get in touch</h1>
          <p className="ds-lead">Questions about a clean, or ready to book? Call, text, or send a message — a real person gets back to you.</p>
        </div>
      </section>

      <section className="section-tight">
        <div className="ds-shell contact-grid">
          <form className="quote-panel" onSubmit={(e) => e.preventDefault()}>
            <span className="ds-kicker">Request a quote</span>
            <h2 style={{ margin: "6px 0 18px" }}>Tell us what you need</h2>
            <div className="quote-steps">
              <div className="qstep active"><span className="qnum">1</span> Service &amp; space</div>
              <div className="qstep"><span className="qnum">2</span> Details &amp; timing</div>
              <div className="qstep"><span className="qnum">3</span> Contact</div>
            </div>

            <h3 style={{ marginBottom: 14 }}>What do you need cleaned?</h3>
            <div className="choice-row" style={{ marginBottom: 24 }}>
              {goals.map((g, i) => (
                <label key={g} className={"choice-chip" + (goal === i ? " selected" : "")}>
                  <input type="radio" name="goal" checked={goal === i} onChange={() => setGoal(i)} />
                  {g}
                </label>
              ))}
            </div>

            <div className="form-grid">
              <Field label="Service type" as="select" options={["Standard cleaning", "Deep cleaning", "Move-in / Move-out", "Airbnb turnover", "Office & commercial"]} />
              <Field label="Property type" as="select" options={["Apartment", "House", "Studio", "Office", "Retail / restaurant"]} />
              <Field label="Bedrooms" as="select" options={["Studio", "1", "2", "3", "4+"]} />
              <Field label="Bathrooms" as="select" options={["1", "2", "3", "4+"]} />
              <Field label="Approx. square footage" placeholder="e.g. 850" />
              <Field label="How often?" as="select" options={["One-time", "Weekly", "Biweekly", "Monthly"]} />
              <Field className="wide" style={{ gridColumn: "1 / -1" }} label="Anything we should know?" as="textarea"
                placeholder="Condition, pets, parking, photos to follow…" hint="Photos help us size the team for deeper jobs." />
            </div>

            <div className="form-actions">
              <span style={{ alignSelf: "center", color: "var(--text-faint)", fontSize: ".85rem" }}>Step 1 of 3</span>
              <Button variant="primary" size="lg" iconRight={<Icon name="arrow" size={18} />}>Continue</Button>
            </div>
          </form>

          <aside style={{ display: "grid", gap: 16 }}>
            <div className="contact-cards">
              {cards.map((c) => (
                <div className="contact-card" key={c.h}>
                  <span className="footer-ico"><Icon name={c.icon} size={20} stroke="var(--teal-700)" /></span>
                  <h4>{c.h}</h4>
                  {c.href ? <a href={c.href}>{c.v}</a> : <p>{c.v}</p>}
                </div>
              ))}
            </div>
            <div className="aside-card brand">
              <span className="ds-kicker" style={{ color: "var(--leaf-300)" }}>Follow along</span>
              <p>See recent cleaning work on our social profiles and Google Business Profile.</p>
              <div className="footer-socials" style={{ flexWrap: "wrap" }}>
                {["Instagram", "Facebook", "YouTube", "TikTok", "Google"].map((s) => <a key={s} href="#" style={{ color: "rgba(255,255,255,.85)" }}>{s}</a>)}
              </div>
            </div>
          </aside>
        </div>
      </section>
      <Footer />
    </>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
};
mount();
</script>
</body>
</html>
