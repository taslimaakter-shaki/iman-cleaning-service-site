  <body>
    <main>
      <img src="assets/iman-logo.png" alt="Iman Cleaning Service LLC" />
      <h1>Quote approved</h1>
      <p>
        Thank you. Your payment was received and your quote is approved. Iman
        Cleaning Service LLC will follow up with your appointment details.
      </p>
      <a href="https://www.imancleaningservice.com">Return to website</a>
    </main>
    <div data-site-footer></div>
    <script src="./site-footer.js?v=20260827-unified-footer"></script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("session_id") || "";
        if (!sessionId) return;

        const storageKey = `iman-payment-record-${sessionId}`;
        if (window.localStorage.getItem(storageKey) === "sent") return;

        fetch("/api/quote/payment-record", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId })
        })
          .then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.error || "Approval record could not be saved automatically.");
            }
            window.localStorage.setItem(storageKey, "sent");
            const purchase = data.analyticsPurchase || {};
            const transactionId = String(purchase.transactionId || sessionId);
            const analyticsKey = `imanGooglePurchase:${transactionId}`;
            if (window.localStorage.getItem(analyticsKey) !== "1" && typeof window.gtag === "function") {
              window.gtag("event", "deposit_paid", { transaction_id: transactionId, value: Number(purchase.value || 0), currency: String(purchase.currency || "USD") });
              window.localStorage.setItem(analyticsKey, "1");
            }
            if (typeof window.imanMetaTrackPurchase === "function") {
              window.imanMetaTrackPurchase({ transactionId, value: Number(purchase.value || 0), currency: String(purchase.currency || "USD") });
            }
          })
          .catch(() => {});
      })();
    </script>
  <script defer src="./site-reviews.js?v=20260911-trusted-title"></script>
</body>
</html>
