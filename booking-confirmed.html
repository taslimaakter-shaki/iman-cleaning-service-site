<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Confirmed | Iman Cleaning Service LLC</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./design-system.css">
  <link rel="stylesheet" href="./homepage-footer.css?v=20260727-footer-location">
  <style>
    body{min-height:100vh;margin:0;display:flex;flex-direction:column;background:#f4f8f7;color:#1f2933;font-family:Inter,system-ui,sans-serif}
    main{width:min(680px,calc(100% - 32px));margin:auto;padding:clamp(28px,6vw,52px);background:#fff;border:1px solid #d8e4e2;border-radius:24px;box-shadow:0 24px 60px rgba(5,54,64,.12)}
    .check{display:grid;width:64px;height:64px;place-items:center;border-radius:50%;background:#0b6474;color:#fff;font-size:2rem}
    h1{margin:24px 0 12px;color:#053640;font-size:clamp(2rem,6vw,3.4rem)}
    p{color:#62717f;line-height:1.7}
    .id{margin-top:18px;padding:14px;background:#eef8f8;border-radius:12px;font-weight:800;color:#075f5d}
    a{display:inline-block;margin-top:22px;color:#075f5d;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Your cleaning is confirmed.</h1>
    <p data-confirmation-status>Your full payment was received. We are finalizing your appointment and sending your confirmation and PDF invoice.</p>
    <div class="id" data-booking-id></div>
    <a href="./index.html">Return to the homepage</a>
  </main>
  <div data-site-footer></div>
	  <script>
	    try {
	      window.localStorage.removeItem("imanBookingDraftV2");
	      window.sessionStorage.removeItem("imanBookingZip");
	      window.sessionStorage.removeItem("imanBookingQualificationDraft");
	    } catch {}
	    const bookingId = new URLSearchParams(location.search).get("booking_id") || "";
    const sessionId = new URLSearchParams(location.search).get("session_id") || "";
    const idBox = document.querySelector("[data-booking-id]");
    const statusBox = document.querySelector("[data-confirmation-status]");
    idBox.textContent = bookingId ? `Booking reference: ${bookingId}` : "Your booking reference is included in your receipt.";
    if (sessionId) {
      fetch("/api/quote/payment-record", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId })
      })
        .then(async (response) => {
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Confirmation could not be finalized.");
          statusBox.textContent = "Your full payment was received and your appointment is reserved. Your confirmation, PDF invoice, and private rescheduling or cancellation link have been sent by email and text.";
        })
        .catch(() => {
          statusBox.textContent = "Your payment was received. Keep your booking reference below; if your email is delayed, please call us so we can confirm the details.";
        });
    }
  </script>
  <script src="./site-footer.js?v=20260727-footer-location"></script>
</body>
</html>
