<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Iman Cleaning Service LLC</title>
  <meta name="description" content="Securely reset the password for your Iman Cleaning Service customer account.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./customer-account.css?v=20260824-premium-login">
</head>
<body class="account-page login-page">
  <header class="login-header">
    <nav class="login-header-inner" aria-label="Customer portal navigation">
      <a class="login-brand" href="./index.html" aria-label="Iman Cleaning Service home">
        <img src="./assets/iman-logo-icon.png" alt="">
        <span>Iman Cleaning Service LLC</span>
      </a>
      <a class="login-back-link" href="./login.html">Back to login</a>
    </nav>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="reset-title">
      <p class="login-eyebrow">Customer portal</p>
      <h1 id="reset-title">Set a new password</h1>
      <p class="login-intro">Choose a secure password for your customer account.</p>

      <form class="login-form" data-reset-form novalidate>
        <div class="login-field">
          <label for="new-password">New password</label>
          <div class="login-password-wrap">
            <input id="new-password" type="password" name="password" autocomplete="new-password" minlength="8" required>
            <button class="login-password-toggle" type="button" aria-controls="new-password" aria-pressed="false" data-password-toggle>Show</button>
          </div>
        </div>
        <div class="login-field">
          <label for="confirm-password">Confirm new password</label>
          <div class="login-password-wrap">
            <input id="confirm-password" type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required>
            <button class="login-password-toggle" type="button" aria-controls="confirm-password" aria-pressed="false" data-password-toggle>Show</button>
          </div>
        </div>
        <p class="login-help">Use at least 8 characters.</p>
        <div class="account-status login-status" data-reset-status role="status" aria-live="polite" tabindex="-1"></div>
        <button class="login-submit" type="submit" data-reset-submit>Save new password</button>
      </form>

      <div class="login-card-footer">
        <span aria-hidden="true">🔒</span>
        <span>Secure customer account</span>
        <span aria-hidden="true">·</span>
        <a href="./privacy-policy.html">Privacy Policy</a>
      </div>
    </section>
    <p class="login-estimate">Need a cleaning? <a href="./book-now.html">Get a free estimate</a> — no account required.</p>
  </main>

  <script>
    (() => {
      const form = document.querySelector("[data-reset-form]");
      const submitButton = document.querySelector("[data-reset-submit]");
      const statusElement = document.querySelector("[data-reset-status]");
      const hash = new URLSearchParams(location.hash.slice(1));
      const tokens = {
        accessToken: hash.get("access_token") || "",
        refreshToken: hash.get("refresh_token") || "",
        expiresIn: Number(hash.get("expires_in") || 3600)
      };
      const authError = hash.get("error_description") || "";
      history.replaceState(null, "", `${location.pathname}${location.search}`);

      const setStatus = (message, type = "error") => {
        statusElement.textContent = message;
        statusElement.className = `account-status login-status${message ? ` show ${type}` : ""}`;
        if (message && type === "error") statusElement.focus({ preventScroll: true });
      };

      const setBusy = (busy) => {
        submitButton.disabled = busy;
        submitButton.textContent = busy ? "Saving password…" : "Save new password";
      };

      document.querySelectorAll("[data-password-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.getAttribute("aria-controls"));
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          button.textContent = show ? "Hide" : "Show";
          button.setAttribute("aria-pressed", String(show));
        });
      });

      if (!tokens.accessToken || !tokens.refreshToken) {
        submitButton.disabled = true;
        setStatus(authError || "This password-reset link is invalid or has expired. Request a new link from the login page.");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.checkValidity()) return form.reportValidity();
        const data = Object.fromEntries(new FormData(form));
        if (data.password !== data.confirmPassword) {
          setStatus("The passwords do not match. Please enter them again.");
          document.getElementById("confirm-password").focus();
          return;
        }
        setBusy(true);
        setStatus("", "info");
        try {
          const response = await fetch("/api/account/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...tokens, password: data.password })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "Your password could not be updated. Request a new reset link and try again.");
          setStatus("Your password has been updated. Opening your customer account…", "success");
          window.setTimeout(() => location.replace("./account.html"), 900);
        } catch (error) {
          setStatus(error.message);
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
