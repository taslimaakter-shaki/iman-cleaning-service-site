<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Unsubscribe | IMAN Cleaning Service LLC</title><style>body{margin:0;background:#f6f4ee;color:#0b3840;font:16px/1.5 system-ui,sans-serif}.card{box-sizing:border-box;max-width:560px;margin:10vh auto;padding:32px;background:#fff;border:1px solid #cfe1df;border-radius:24px;box-shadow:0 18px 55px #0b384018}h1{margin-top:0}label{display:block;font-weight:700;margin:20px 0 8px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #aac8c7;border-radius:12px;font:inherit}button{margin-top:16px;padding:14px 20px;border:0;border-radius:999px;background:#087181;color:#fff;font:700 16px system-ui;cursor:pointer}.status{margin-top:18px}a{color:#087181}</style></head><body><main class="card"><h1>Unsubscribe from promotional email</h1><p>You may unsubscribe from IMAN Cleaning Service LLC marketing emails at any time. Appointment, quote, and payment messages are separate service communications.</p><form id="unsubscribe-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><button type="submit">Unsubscribe</button><p class="status" id="status" aria-live="polite"></p></form><p><a href="./">Return to the website</a></p></main><script>const form=document.getElementById('unsubscribe-form'),email=form.elements.email,status=document.getElementById('status');email.value=new URLSearchParams(location.search).get('email')||'';form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Processing…';try{const response=await fetch('/api/marketing/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to unsubscribe.');form.reset();status.textContent='You have been unsubscribed from promotional email.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
